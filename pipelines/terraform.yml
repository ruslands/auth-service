default:
  image: registry.gitlab.com/gitlab-org/terraform-images/releases/1.3:v1.8.0

variables:
  TF_CLI_CONFIG_FILE: .terraform.tfrc
  TF_INIT_FLAGS: "-lockfile=readonly"
  TF_PROJECT: default
  TF_PARALLELISM: 15
  TF_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_PROJECT}

stages:
  - prepare
  - gate
  - build
  - deploy

.terraform:
  cache:
    key: $CI_COMMIT_REF_NAME-terraform
    paths:
      - .terraform
    policy: pull
  before_script:
    - echo "$TF_SECRETS" | base64 -d > $CI_PROJECT_DIR/secrets.auto.tfvars

terrafrom:init:
  stage: prepare
  extends:
    - .terraform
  cache:
    policy: pull-push
  script:
    - gitlab-terraform init
  rules:
    - if: $CI_PIPELINE_SOURCE == 'pipeline'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_ID

terraform:lint:
  stage: gate
  extends:
    - .terraform
  before_script: []
  script:
    - gitlab-terraform fmt -check -diff -write=false
  rules:
    - if: $CI_PIPELINE_SOURCE == 'pipeline'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_ID

terraform:validate:
  stage: gate
  extends:
    - .terraform
  script:
    - gitlab-terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == 'pipeline'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_ID

terraform:apply:
  stage: deploy
  extends:
    - .terraform
  environment:
    name: terraform
  resource_group: $CI_ENVIRONMENT_NAME
  script:
    # - gitlab-terraform force-unlock -force a0c71d13-8d93-a5eb-8025-b6296bdd1334
    - gitlab-terraform plan -parallelism=$TF_PARALLELISM
    - gitlab-terraform apply -lock=false -parallelism=$TF_PARALLELISM -auto-approve
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
